services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - ${BACKEND_FQDN}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${BACKEND_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      DISABLE_SECURE_COOKIES: ${DISABLE_SECURE_COOKIES}
      DEMO_USER_ID: ${DEMO_USER_ID}
      DEMO_USER_NAME: ${DEMO_USER_NAME}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      LOG_SQL: ${LOG_SQL}
    ports:
      - "8000:${BACKEND_PORT}"
    command: >
      sh -c "python scripts/wait_for_db.py && uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    depends_on:
      - backend
    environment:
      PORT: ${FRONTEND_PORT}
      BACKEND_SCHEMA: ${BACKEND_SCHEMA}
      BACKEND_FQDN: ${BACKEND_FQDN}
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "3000:${FRONTEND_PORT}"

volumes:
  postgres_data:
