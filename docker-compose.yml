services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-portfoliouser}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-app}
      PORT: ${BACKEND_PORT:-80}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      DISABLE_SECURE_COOKIES: ${DISABLE_SECURE_COOKIES:-true}
      DEMO_USER_ID: ${DEMO_USER_ID}
      DEMO_USER_NAME: ${DEMO_USER_NAME}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      LOG_SQL: ${LOG_SQL}
    ports:
      - "8000:${BACKEND_PORT:-80}"
    command: >
      sh -c "python scripts/wait_for_db.py && uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-80}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    depends_on:
      - backend
    environment:
      PORT: ${FRONTEND_PORT:-80}
      APP_SERVICE_HOST: ${APP_SERVICE_HOST:-http://backend:${BACKEND_PORT:-80}/api}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:${FRONTEND_PORT:-80}"

volumes:
  postgres_data:
