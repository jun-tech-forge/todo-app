version: 0.2

env:
  variables:
    DOCKER_BUILDKIT: "1"
    CONTAINER_NAME: "frontend"

phases:
  pre_build:
    commands:
      - echo ===== pre build phase =====
      - test -n "$AWS_ACCOUNT_ID"
      - test -n "$AWS_REGION"
      - test -n "$FRONTEND_IMAGE_REPO"
      - export DOCKER_CONTENT_TRUST=1
      - export ECR_REPOS_DOMAIN=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
      - export ECR_REPOS_URI=${ECR_REPOS_DOMAIN}/${FRONTEND_IMAGE_REPO}
      - export IMAGE_TAG=${IMAGE_TAG:-$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)}
      - echo ECR_REPOS_URI=${ECR_REPOS_URI}

  build:
    commands:
      - echo ===== build phase =====
      - echo Docker Build started on `date`
      - echo Building the Docker image...
      - docker buildx build -f frontend/Dockerfile -t ${FRONTEND_IMAGE_REPO}:latest frontend
      - docker image tag ${FRONTEND_IMAGE_REPO}:latest ${ECR_REPOS_URI}:${IMAGE_TAG}
      - docker image ls
      - echo Completed the ${FRONTEND_IMAGE_REPO} Docker image build.
      - export DOCKER_CONTENT_TRUST=0

  post_build:
    commands:
      - echo ===== post build phase =====
      - echo Logging in to Amazon ECR.
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "https://${ECR_REPOS_DOMAIN}"
      - echo Docker Image ${FRONTEND_IMAGE_REPO} pushing to ECR on `date`
      - docker image push ${ECR_REPOS_URI}:${IMAGE_TAG}
      - echo '[{"name":"'${CONTAINER_NAME}'","imageUri":"'${ECR_REPOS_URI}':'${IMAGE_TAG}'"}]' > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
