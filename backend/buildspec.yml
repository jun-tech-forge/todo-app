version: 0.2

env:
  variables:
    DOCKER_BUILDKIT: "1"
    CONTAINER_NAME: "app"

phases:
  pre_build:
    commands:
      - echo ===== pre build phase =====
      - test -n "$AWS_ACCOUNT_ID"
      - test -n "$AWS_REGION"
      - test -n "$APP_NAME"
      - export ECR_REPOS_DOMAIN=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
      - export ECR_REPOS_URI=${ECR_REPOS_DOMAIN}/${APP_NAME}
      - export IMAGE_TAG=${IMAGE_TAG:-$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)}
      - echo ECR_REPOS_URI=${ECR_REPOS_URI}
      - echo IMAGE_TAG=${IMAGE_TAG}

  build:
    commands:
      - echo ===== build phase =====
      - echo Docker Build started on `date`
      - echo Building the Docker image...
      - docker buildx build --load --progress=plain -f backend/Dockerfile -t ${APP_NAME}:latest backend
      - docker image tag ${APP_NAME}:latest ${ECR_REPOS_URI}:${IMAGE_TAG}
      - docker image ls
      - echo Completed the ${APP_NAME} Docker image build.

  post_build:
    commands:
      - echo ===== post build phase =====
      - echo Logging in to Amazon ECR.
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPOS_DOMAIN}"
      - echo Docker Image ${APP_NAME} pushing to ECR on `date`
      - docker image push ${ECR_REPOS_URI}:${IMAGE_TAG}
      - echo '[{"name":"'${CONTAINER_NAME}'","imageUri":"'${ECR_REPOS_URI}':'${IMAGE_TAG}'"}]' > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
